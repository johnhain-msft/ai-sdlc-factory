name: SDLC cascade router
on:
  repository_dispatch:
    types:
      - upstream_pr_merged
  schedule:
    - cron: 7 */4 * * *
  workflow_dispatch:
    inputs:
      reset_blocked:
        description: Clear the failure and blocked state of every upstream before routing
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  route:
    name: route ${{ matrix.upstreamKey }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
