            mode: ai-adaptation
            schedule: 7 */4 * * *
            onCommitOnlyAdvance: noop
            stateVariable: SDLC_SYNC_STATE_LAB_CONTENT
            provenanceFile: content/pages/source-inputs.json
            provenanceJsonPointer: /commit
            onBots:
